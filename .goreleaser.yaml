version: 2

builds:
  - main: ./cmd/engram
    binary: engram
    ldflags:
      - -s -w
    env:
      - CGO_ENABLED=0
    goos: [darwin, linux]
    goarch: [amd64, arm64]

archives:
  - formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"

checksum:
  name_template: checksums.txt

brews:
  - name: engram
    repository:
      owner: shiblon
      name: homebrew-engram
      token: "{{ .Env.HOMEBREW_TAP_GITHUB_TOKEN }}"
    homepage: "https://github.com/shiblon/engram"
    description: "Auto-memory system for AI coding agents"
    license: "Apache-2.0"
    install: |-
      bin.install "engram"
    test: |-
      system bin/"engram", "--version"

# Debian packages attached to each release for dpkg install. No apt repo yet --
# these are download-and-install artifacts, not an auto-updating source. nFPM is
# bundled in goreleaser, so this adds no CI tooling. Linux-only by nature; the
# darwin builds are skipped automatically.
nfpms:
  - package_name: engram
    homepage: "https://github.com/shiblon/engram"
    description: "Auto-memory system for AI coding agents"
    maintainer: "Chris Monson <chris@abundantsecurity.co>"
    license: "Apache-2.0"
    section: utils
    formats:
      - deb

changelog:
  use: git
  sort: asc
  groups:
    - title: Features
      regexp: '^.*?feat(\(.+\))??!?:.+$'
      order: 0
    - title: Bug fixes
      regexp: '^.*?fix(\(.+\))??!?:.+$'
      order: 1
    - title: Others
      order: 999
  filters:
    exclude:
      - '^docs(\(.+\))?:'
      - '^test(\(.+\))?:'
      - '^chore(\(.+\))?:'
      - '^ci(\(.+\))?:'
      - '(?i)^update.*(long term )?mem'
      - '(?i)^updated plan'

release:
  github:
    owner: shiblon
    name: engram
